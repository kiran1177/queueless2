<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="QueueLess - Smart Government-Office Virtual Queue and Token Management System. Skip physical lines, take virtual tokens, track wait times and arrive when your turn approaches.">
  <title>QueueLess - Smart Government Office Queue & Token Management</title>

  <!-- Modern Clean Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Hind+Vadodara:wght@400;500;600;700&family=Hind:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="./index.css">
</head>

<body>
  <div id="app-root">
    <!-- Application renders here -->
    <div style="min-height: 100vh; display: grid; place-items: center; background-color: #F8FAFC;">
      <div style="text-align: center;">
        <div style="font-size: 36px; margin-bottom: 12px; animation: spin 1s infinite linear;">⚙️</div>
        <h2 style="color: #1E3A8A; font-family: 'Poppins', sans-serif;">Initializing QueueLess Government System...</h2>
        <p style="color: #64748B; font-size: 14px; margin-top: 6px;">Connecting to MongoDB and loading live office queue
          data...</p>
      </div>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>

</html>
